name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tests\run.ps1
